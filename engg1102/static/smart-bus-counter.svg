<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Smart Bus Capacity Counter</title><desc id="desc">A bus with five seat lights, an open door and a sensor, beside the words Sense, Count, Close.</desc>
<rect width="640" height="360" rx="20" fill="#eaf1f7"/>
<rect x="40" y="100" width="270" height="150" rx="20" fill="#16344b"/>
<rect x="60" y="120" width="40" height="45" rx="6" fill="#3fbf6f"/><rect x="108" y="120" width="40" height="45" rx="6" fill="#3fbf6f"/><rect x="156" y="120" width="40" height="45" rx="6" fill="#3fbf6f"/><rect x="204" y="120" width="40" height="45" rx="6" fill="#eaf1f7"/>
<rect x="255" y="120" width="40" height="110" rx="4" fill="#eaf1f7"/>
<circle cx="275" cy="92" r="9" fill="#ef4160"/>
<circle cx="100" cy="255" r="24" fill="#5b6b78"/><circle cx="250" cy="255" r="24" fill="#5b6b78"/>
<text x="345" y="125" font-family="sans-serif" font-size="32" fill="#16344b">Option 3</text><text x="345" y="175" font-family="sans-serif" font-size="26" fill="#16344b">Sense</text><text x="345" y="215" font-family="sans-serif" font-size="26" fill="#16344b">Count</text><text x="345" y="255" font-family="sans-serif" font-size="26" fill="#16344b">Close</text>
